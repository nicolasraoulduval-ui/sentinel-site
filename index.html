<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel — Portfolio intelligence pour fonds VC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAFAF7; --surface: #FFFFFF; --surface-2: #F4F2EC;
  --border: #E8E5DD; --border-strong: #D6D2C6;
  --text: #0F172A; --text-2: #4B5563; --text-3: #8B8579;
  --accent: #0F172A; --gold: #FBBF24;
  --healthy: #166534; --healthy-bg: #DCFCE7;
  --watch: #92400E; --watch-bg: #FEF3C7;
  --alert: #991B1B; --alert-bg: #FEE2E2;
  --info: #1E40AF; --info-bg: #DBEAFE;
  --radius: 8px; --radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Public Sans', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.tabular, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: 'JetBrains Mono', monospace; }
.serif { font-family: 'Newsreader', serif; }
button, input { font-family: inherit; font-size: inherit; color: inherit; border: none; background: none; outline: none; }
a { color: inherit; text-decoration: none; }

.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

/* Sidebar */
.sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { padding: 6px 10px; margin-bottom: 22px; }
.brand-wordmark { display: block; width: 100%; max-width: 175px; height: auto; }

.fund-switcher { margin: 0 6px 18px; padding: 10px; background: var(--surface-2); border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s; }
.fund-switcher:hover { background: #EDEAE2; }
.fund-mark { width: 26px; height: 26px; background: linear-gradient(135deg, #475569, #1E293B); border-radius: 5px; display: grid; place-items: center; color: white; font-weight: 600; font-size: 11px; }
.fund-info { flex: 1; min-width: 0; }
.fund-name { font-weight: 600; font-size: 13px; line-height: 1.2; }
.fund-meta { color: var(--text-3); font-size: 11px; margin-top: 1px; }

.nav-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); padding: 8px 14px 6px; margin-top: 4px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 6px; color: var(--text-2); font-weight: 500; font-size: 13.5px; cursor: pointer; transition: background 0.12s, color 0.12s; margin: 1px 0; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent); color: white; }
.nav-item.active .nav-count { background: rgba(255,255,255,0.18); color: white; }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-count { margin-left: auto; background: var(--surface-2); color: var(--text-2); border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 600; }

.sidebar-footer { margin-top: auto; padding: 10px 6px 4px; border-top: 1px solid var(--border); }
.user-card { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; transition: background 0.12s; }
.user-card:hover { background: var(--surface-2); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #FBBF24, #B45309); display: grid; place-items: center; color: white; font-weight: 600; font-size: 11.5px; flex-shrink: 0; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-weight: 600; font-size: 13px; line-height: 1.2; }
.user-role { color: var(--text-3); font-size: 11px; margin-top: 1px; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar { height: 56px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.85); backdrop-filter: saturate(140%) blur(8px); display: flex; align-items: center; padding: 0 24px; gap: 16px; position: sticky; top: 0; z-index: 10; }
.search { flex: 1; max-width: 480px; display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius); padding: 7px 12px; color: var(--text-3); cursor: text; }
.search input { flex: 1; background: transparent; }
.search input::placeholder { color: var(--text-3); }
.shortcut { font-size: 11px; color: var(--text-3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: white; }

.period-selector { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.period-selector button { padding: 6px 11px; font-size: 12.5px; font-weight: 500; color: var(--text-2); cursor: pointer; border-right: 1px solid var(--border); }
.period-selector button:last-child { border-right: none; }
.period-selector button.active { background: var(--accent); color: white; }
.period-selector button:hover:not(.active) { background: var(--surface-2); }

.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 6px; cursor: pointer; color: var(--text-2); position: relative; transition: background 0.12s; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .badge { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; background: var(--alert); border-radius: 50%; border: 2px solid var(--surface); }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 6px; font-weight: 500; font-size: 13px; cursor: pointer; transition: background 0.12s, color 0.12s; border: 1px solid transparent; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: #1E293B; }
.btn-ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn svg { width: 14px; height: 14px; }

.content { padding: 28px 32px 80px; max-width: 1480px; width: 100%; margin: 0 auto; transition: opacity 0.18s ease; }

.page-header { margin-bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.page-eyebrow { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); margin-bottom: 6px; }
.page-title { font-family: 'Newsreader', serif; font-size: 30px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.1; }
.page-subtitle { margin-top: 8px; color: var(--text-2); font-size: 14.5px; max-width: 720px; }

/* KPI strip */
.kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 24px; overflow: hidden; }
.kpi-cell { padding: 18px 22px; border-right: 1px solid var(--border); }
.kpi-cell:last-child { border-right: none; }
.kpi-label { font-size: 12px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
.kpi-value { font-family: 'Newsreader', serif; font-size: 28px; font-weight: 500; letter-spacing: -0.01em; margin-top: 6px; line-height: 1.1; }
.kpi-meta { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
.kpi-trend.up { color: var(--healthy); font-weight: 600; }
.kpi-trend.down { color: var(--alert); font-weight: 600; }
.kpi-trend.neutral { color: var(--text-3); }

/* Banner */
.banner { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--radius-lg); margin-bottom: 22px; background: var(--alert-bg); border: 1px solid #FCA5A5; }
.banner-icon { width: 36px; height: 36px; background: white; border-radius: 8px; display: grid; place-items: center; color: var(--alert); flex-shrink: 0; }
.banner-body { flex: 1; }
.banner-title { font-weight: 600; font-size: 14px; }
.banner-desc { color: var(--text-2); font-size: 13px; margin-top: 2px; }

/* Filter chips */
.filter-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.chip { padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: white; color: var(--text-2); transition: all 0.12s; }
.chip:hover { background: var(--surface-2); }
.chip.active { background: var(--accent); border-color: var(--accent); color: white; }
.chip-count { color: var(--text-3); margin-left: 4px; font-weight: 400; }
.chip.active .chip-count { color: rgba(255,255,255,0.6); }

/* Portfolio grid */
.portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.portco-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; cursor: pointer; transition: transform 0.15s ease-out, box-shadow 0.15s, border-color 0.15s; position: relative; overflow: hidden; }
.portco-card:hover { transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(15,23,42,0.08); border-color: var(--border-strong); }
.portco-card.alert::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--alert); }
.portco-card.watch::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--watch); }

.portco-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.portco-id { display: flex; align-items: center; gap: 10px; }
.portco-mark { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: white; font-family: 'Newsreader', serif; font-weight: 600; font-size: 15px; flex-shrink: 0; }
.portco-name { font-weight: 600; font-size: 14.5px; line-height: 1.2; }
.portco-meta { color: var(--text-3); font-size: 11.5px; margin-top: 2px; }
.status-pill { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 8px; border-radius: 999px; background: var(--healthy-bg); color: var(--healthy); white-space: nowrap; }
.status-pill.watch { background: var(--watch-bg); color: var(--watch); }
.status-pill.alert { background: var(--alert-bg); color: var(--alert); }
.portco-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.metric-label { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }
.metric-value { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 16px; margin-top: 3px; letter-spacing: -0.01em; }
.metric-delta { font-size: 11.5px; font-weight: 600; margin-top: 1px; }
.metric-delta.up { color: var(--healthy); }
.metric-delta.down { color: var(--alert); }
.metric-delta.flat { color: var(--text-3); }
.portco-spark { margin: 8px -2px 0; height: 36px; }
.portco-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--text-3); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--healthy); display: inline-block; margin-right: 5px; }
.dot.amber { background: #D97706; }
.dot.red { background: var(--alert); }

/* Detail */
.detail-head { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 24px; }
.detail-mark { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; color: white; font-family: 'Newsreader', serif; font-weight: 600; font-size: 28px; flex-shrink: 0; }
.detail-info { flex: 1; }
.detail-name { font-family: 'Newsreader', serif; font-size: 30px; font-weight: 500; letter-spacing: -0.018em; line-height: 1.1; }
.detail-tagline { color: var(--text-2); margin-top: 4px; font-size: 14px; }
.detail-tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.tag { padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }

.investment-summary { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 22px; overflow: hidden; }
.investment-summary .kpi-cell { padding: 14px 18px; }
.investment-summary .kpi-value { font-size: 22px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.card-head { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.card-title { font-weight: 600; font-size: 14px; }
.card-body { padding: 18px; }
.chart-stage { padding: 18px 22px 8px; }

.detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; margin-bottom: 22px; }
@media (max-width: 1100px) { .detail-grid { grid-template-columns: 1fr; } }

/* Cap table */
.cap-table { width: 100%; }
.cap-table th, .cap-table td { padding: 9px 12px; text-align: left; font-size: 12.5px; border-bottom: 1px solid var(--border); }
.cap-table th { font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10.5px; background: var(--surface-2); }
.cap-table td.num { font-family: 'JetBrains Mono', monospace; text-align: right; }

/* Generic table */
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.row { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.12s; }
.row:last-child { border-bottom: none; }
.row:hover { background: var(--surface-2); }

/* LP letter */
.lp-letter { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 48px 64px; font-family: 'Newsreader', Georgia, serif; font-size: 15.5px; line-height: 1.75; max-width: 820px; margin: 0 auto; }
.lp-letter h2 { font-size: 26px; font-weight: 500; letter-spacing: -0.014em; margin-bottom: 6px; }
.lp-letter .lp-period { color: var(--text-3); font-family: 'Public Sans', sans-serif; font-size: 13px; margin-bottom: 32px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
.lp-letter p { margin-bottom: 16px; }
.lp-letter h3 { font-size: 18px; font-weight: 500; margin: 32px 0 8px; letter-spacing: -0.015em; }
.lp-stat-row { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 18px 0; margin: 24px 0; font-family: 'Public Sans', sans-serif; }
.lp-stat-cell { text-align: center; }
.lp-stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
.lp-stat-val { font-family: 'Newsreader', serif; font-size: 22px; font-weight: 500; margin-top: 4px; }
.lp-actions { display: flex; gap: 10px; margin-bottom: 18px; }

/* Settings */
.settings-grid { display: grid; grid-template-columns: 220px 1fr; gap: 28px; }
.settings-nav-item { padding: 9px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 500; color: var(--text-2); cursor: pointer; }
.settings-nav-item.active { background: var(--surface-2); color: var(--text); }
.settings-nav-item:hover:not(.active) { background: var(--surface-2); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(15,23,42,0.2); opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Guide tooltip */
.guide { position: fixed; bottom: 24px; right: 24px; width: 320px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px 14px; box-shadow: 0 16px 40px -10px rgba(15,23,42,0.18), 0 4px 8px rgba(15,23,42,0.06); z-index: 150; transform: translateY(8px); opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; }
.guide.show { opacity: 1; transform: translateY(0); }
.guide-step { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 4px; }
.guide-title { font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.2; margin-bottom: 8px; color: var(--text); }
.guide-desc { font-size: 13px; line-height: 1.55; color: var(--text-2); margin-bottom: 14px; }
.guide-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.guide-dots { display: flex; gap: 5px; flex-shrink: 0; }
.guide-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); transition: background 0.15s; }
.guide-dot.active { background: var(--accent); }
.guide-actions { display: flex; gap: 6px; flex-shrink: 0; }
.guide-btn { font-size: 12.5px; font-weight: 500; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: background 0.12s; white-space: nowrap; }
.guide-btn.ghost { color: var(--text-2); }
.guide-btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.guide-btn.primary { background: var(--accent); color: white; font-weight: 600; }
.guide-btn.primary:hover { background: #1E293B; }
.guide-reopen { position: fixed; bottom: 24px; right: 24px; width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: white; display: none; place-items: center; cursor: pointer; box-shadow: 0 8px 20px rgba(15,23,42,0.22); z-index: 150; transition: transform 0.15s; }
.guide-reopen.show { display: grid; }
.guide-reopen:hover { transform: translateY(-2px); }

/* Notifications dropdown */
.notif-dropdown { position: absolute; top: 50px; right: 0; width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px -10px rgba(15,23,42,0.22); z-index: 100; opacity: 0; pointer-events: none; transform: translateY(-6px); transition: opacity 0.15s, transform 0.15s; }
.notif-dropdown.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
.notif-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.notif-row { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 11px; cursor: pointer; transition: background 0.12s; }
.notif-row:hover { background: var(--surface-2); }
.notif-row:last-child { border-bottom: none; }
.notif-dot-sev { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
.notif-time { font-size: 11px; color: var(--text-3); margin-top: 3px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.42); backdrop-filter: blur(2px); z-index: 300; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.modal-overlay.open { display: flex; opacity: 1; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 580px; max-height: 88vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(15,23,42,0.32); transform: translateY(8px); transition: transform 0.2s; }
.modal-overlay.open .modal { transform: translateY(0); }
.modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: 'Newsreader', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.015em; }
.modal-close { width: 30px; height: 30px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; color: var(--text-2); transition: background 0.12s; }
.modal-close:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

@media (max-width: 800px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } .investment-summary, .kpi-strip { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-wordmark" width="170" height="44" viewBox="0 0 170 44" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="brandLightGlow"><stop offset="0%" stop-color="#FBBF24" stop-opacity="1"/><stop offset="25%" stop-color="#FBBF24" stop-opacity="0.7"/><stop offset="60%" stop-color="#FBBF24" stop-opacity="0.18"/><stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
        </defs>
        <text id="brand-text" x="0" y="36" font-family="Newsreader, serif" font-size="38" font-weight="500" fill="#0F172A" letter-spacing="-0.5">Sentinel</text>
        <g id="brand-light">
          <circle cx="68" cy="13" r="5" fill="#FFFFFF"/>
          <circle cx="68" cy="13" r="11" fill="url(#brandLightGlow)"/>
          <circle cx="68" cy="13" r="2.6" fill="#FBBF24"/>
        </g>
      </svg>
    </div>

    <div class="fund-switcher" onclick="openModal('fund-switcher')">
      <div class="fund-mark">SE</div>
      <div class="fund-info">
        <div class="fund-name">Sequoia Émergence</div>
        <div class="fund-meta">Fund III · €120M</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-3)"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>

function deltaLookback() { return currentPeriod === 'month' ? 1 : currentPeriod === 'quarter' ? 3 : 11; }
function periodShort() { return currentPeriod === 'month' ? '1M' : currentPeriod === 'quarter' ? '3M' : '12M'; }

function fmtEur(v) {
  if (v >= 1e6) return '€' + (v/1e6).toFixed(v >= 10e6 ? 1 : 1) + 'M';
  if (v >= 1e3) return '€' + Math.round(v/1e3) + 'K';
  return '€' + v;
}
function fmtPct(v) { return (v >= 0 ? '+' : '') + (v*100).toFixed(1).replace('.', ',') + '%'; }

function sparkline(data, w=250, h=36, color='#0F172A') {
  if (!data || data.length === 0) return '';
  const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
  const stepX = w / (data.length - 1);
  const points = data.map((v,i) => `${(i*stepX).toFixed(1)},${(h - 4 - ((v-min)/range)*(h-8)).toFixed(1)}`);
  const fillPts = [`0,${h}`, ...points, `${w},${h}`].join(' ');
  const last = points[points.length-1].split(',');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polygon points="${fillPts}" fill="${color}" opacity="0.07"/><polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${color}"/></svg>`;
}

function areaChart(data, w=720, h=240, color='#0F172A') {
  const padL=46, padR=12, padT=20, padB=32;
  const cw = w - padL - padR, ch = h - padT - padB;
  const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
  const stepX = cw / (data.length - 1);
  const points = data.map((v,i) => `${(padL + i*stepX).toFixed(1)},${(padT + ch - ((v-min)/range)*ch).toFixed(1)}`);
  const yTicks = 4; let gridLines = '', yLabels = '';
  for (let i = 0; i <= yTicks; i++) {
    const y = padT + (ch * i / yTicks); const val = max - (range * i / yTicks);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#E8E5DD" stroke-width="1" ${i===yTicks ? '' : 'stroke-dasharray="3 3"'}/>`;
    const labelV = val >= 1000 ? (val/1000).toFixed(1) + 'k' : Math.round(val);
    yLabels += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-family="JetBrains Mono" font-size="10" fill="#8B8579">€${labelV}</text>`;
  }
  const months = ['déc 24','jan','fév','mar','avr','mai','juin','juil','août','sep','oct','nov 25'];
  let xLabels = '';
  data.forEach((_, i) => {
    if (i % 2 !== 0 && i < data.length - 1) return;
    const x = padL + i * stepX;
    xLabels += `<text x="${x}" y="${h-10}" text-anchor="middle" font-family="Public Sans" font-size="10.5" fill="#8B8579">${months[i] || ''}</text>`;
  });
  const fillPts = [`${padL},${h-padB}`, ...points, `${w-padR},${h-padB}`].join(' ');
  const last = points[points.length-1].split(',');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="grad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.15"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${gridLines}<polygon points="${fillPts}" fill="url(#grad)"/><polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="white" stroke="${color}" stroke-width="2"/>${yLabels}${xLabels}</svg>`;
}

function switchSettingsTab(tabId) {
  currentSettingsTab = tabId;
  document.querySelectorAll('.settings-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tabId);
  });
  const panel = document.getElementById('settings-panel');
  if (panel) {
    panel.style.opacity = '0';
    setTimeout(() => {
      panel.innerHTML = SETTINGS_PANELS[tabId]();
      panel.style.opacity = '1';
    }, 80);
  }
}

// ============================================================================
// NAVIGATION
// ============================================================================

const ROUTES = { dashboard: renderDashboard, detail: renderDetail, inbox: renderInbox, anomalies: renderAnomalies, 'lp-report': renderLPReport, settings: renderSettings };

function navigate(view, arg) {
  currentView = view;
  const content = document.getElementById('content');
  content.style.opacity = '0';
  setTimeout(() => {
    content.innerHTML = ROUTES[view] ? ROUTES[view](arg) : '';
    content.style.opacity = '1';
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.view === view || (view === 'detail' && el.dataset.view === 'dashboard'));
    });
    document.querySelectorAll('.chip[data-filter]').forEach(c => {
      c.addEventListener('click', () => {
        document.querySelectorAll('.chip[data-filter]').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        const f = c.dataset.filter;
        document.querySelectorAll('.portco-card').forEach(card => {
          if (f === 'all') { card.style.display = ''; return; }
          card.style.display = card.classList.contains(f) ? '' : 'none';
        });
      });
    });
    window.scrollTo({ top: 0 });
  }, 80);
}

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.view));
});

// Period selector
function setPeriod(p) {
  if (currentPeriod === p) return;
  currentPeriod = p;
  document.querySelectorAll('#period-selector button').forEach(b => b.classList.toggle('active', b.dataset.period === p));
  if (currentView === 'dashboard') navigate('dashboard');
}
document.querySelectorAll('#period-selector button').forEach(b => {
  b.addEventListener('click', () => setPeriod(b.dataset.period));
});

// Search
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', (e) => {
  if (currentView !== 'dashboard') return;
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.portco-card').forEach(c => {
    const name = c.querySelector('.portco-name')?.textContent.toLowerCase() || '';
    const meta = c.querySelector('.portco-meta')?.textContent.toLowerCase() || '';
    c.style.display = (!q || name.includes(q) || meta.includes(q)) ? '' : 'none';
  });
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchInput.focus(); searchInput.select(); }
  if (e.key === 'Escape' && document.activeElement === searchInput) { searchInput.value = ''; searchInput.dispatchEvent(new Event('input')); searchInput.blur(); }
});

function openModal(name, arg) {
  const m = MODALS[name] ? MODALS[name](arg) : null;
  if (!m) return;
  const ov = document.getElementById('modal-overlay');
  ov.innerHTML = `<div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><div class="modal-title">${m.title}</div><div class="modal-close" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div></div><div class="modal-body">${m.body}</div>${m.foot ? `<div class="modal-foot">${m.foot}</div>` : ''}</div>`;
  ov.classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ============================================================================
// NOTIFICATIONS DROPDOWN
// ============================================================================
const NOTIFS = [
  ['Tendre — runway critique', 'Runway descendu à 5,1 mois. CAC en hausse +24%.', 'il y a 2h', 'high', 'tendre'],
  ['Rumeur — PMF non atteint', 'Pas de croissance ARR depuis 6 mois. Cash sous €600K.', 'il y a 4h', 'high', 'rumeur'],
  ['Ardoise — ARR en baisse', '2 mois consécutifs de décroissance MoM.', 'il y a 6h', 'high', 'ardoise'],
  ['Pigeon — update reçue', 'Update novembre parsée, 14 KPIs extraits (96% conf.).', 'hier', 'low', 'pigeon'],
  ['Cinder — pré-Series A en cours', 'Term sheet reçue, valorisation 3,2× post-money.', 'hier', 'med', 'cinder'],
];
function renderNotifs() {
  document.getElementById('notif-body').innerHTML = NOTIFS.map(([t, d, w, sev, id]) => `
    <div class="notif-row" onclick="closeNotifDropdown();${id ? `navigate('detail','${id}')` : ''}">
      <div class="notif-dot-sev" style="background:${sev==='high'?'var(--alert)':sev==='med'?'var(--watch)':'var(--healthy)'}"></div>
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${t}</div><div style="font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.4">${d}</div><div class="notif-time">${w}</div></div>
    </div>
  `).join('');
}
function toggleNotifDropdown(e) {
  e?.stopPropagation();
  const d = document.getElementById('notif-dropdown');
  if (d.classList.contains('open')) { d.classList.remove('open'); }
  else { renderNotifs(); d.classList.add('open'); }
}
function closeNotifDropdown() { document.getElementById('notif-dropdown')?.classList.remove('open'); }
document.addEventListener('click', (e) => { if (!e.target.closest('#notif-dropdown') && !e.target.closest('#notif-trigger')) closeNotifDropdown(); });

// Toast
let toastEl;
function showToast(msg, dur = 2400) {
  if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.remove('show'), dur);
}

// Brand wordmark — align gold light on i
function alignBrandLight() {
  const text = document.getElementById('brand-text');
  const lightGroup = document.getElementById('brand-light');
  if (!text || !lightGroup) return;
  const svg = text.ownerSVGElement;
  const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  tmp.setAttribute('font-family', 'Newsreader, serif'); tmp.setAttribute('font-size', '38'); tmp.setAttribute('font-weight', '500'); tmp.setAttribute('letter-spacing', '-0.5'); tmp.style.visibility = 'hidden';
  svg.appendChild(tmp);
  tmp.textContent = 'Sent'; const sentEnd = tmp.getComputedTextLength();
  tmp.textContent = 'Senti'; const sentiEnd = tmp.getComputedTextLength();
  tmp.remove();
  const iCenter = sentEnd + (sentiEnd - sentEnd) * 0.4;
  lightGroup.setAttribute('transform', `translate(${(iCenter - 68).toFixed(2)}, 0)`);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignBrandLight);
setTimeout(alignBrandLight, 600); setTimeout(alignBrandLight, 1500);

// Guided tour
const GUIDE_STEPS = [
  { title: 'Vue portefeuille', desc: '25 portcos, KPIs ingérés automatiquement chaque mois. Code couleur par statut. Cliquez une carte pour entrer.', view: 'dashboard' },
  { title: 'Boîte de réception', desc: 'Updates portcos parsées automatiquement (PDF, Excel, Notion, texte libre) avec score de confidence d\'extraction.', view: 'inbox' },
  { title: 'Alertes automatiques', desc: 'Détection des signaux faibles : runway court, croissance en décélération, retard de reporting, écart vs plan.', view: 'anomalies' },
  { title: 'Rapport LP', desc: 'Lettre trimestrielle générée à partir des données portfolio. Module SFDR intégré. Vous éditez puis exportez en PDF.', view: 'lp-report' }
];
let guideStep = 0;
const guideEl = document.createElement('div');
guideEl.className = 'guide';
document.body.appendChild(guideEl);
const reopenEl = document.createElement('div');
reopenEl.className = 'guide-reopen';
reopenEl.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
reopenEl.addEventListener('click', () => { reopenEl.classList.remove('show'); renderGuide(); });
document.body.appendChild(reopenEl);

function renderGuide() {
  const s = GUIDE_STEPS[guideStep];
  if (currentView !== s.view) navigate(s.view);
  guideEl.innerHTML = `
    <div class="guide-step">${guideStep + 1} / ${GUIDE_STEPS.length} · Guide</div>
    <div class="guide-title">${s.title}</div>
    <div class="guide-desc">${s.desc}</div>
    <div class="guide-foot">
      <div class="guide-dots">${GUIDE_STEPS.map((_, i) => `<div class="guide-dot ${i === guideStep ? 'active' : ''}"></div>`).join('')}</div>
      <div class="guide-actions">
        <span class="guide-btn ghost" id="guide-close">Fermer</span>
        ${guideStep > 0 ? '<span class="guide-btn ghost" id="guide-prev">Précédent</span>' : ''}
        <span class="guide-btn primary" id="guide-next">Suivant</span>
      </div>
    </div>
  `;
  guideEl.classList.add('show');
  document.getElementById('guide-close').addEventListener('click', closeGuide);
  document.getElementById('guide-next').addEventListener('click', () => {
    guideStep = (guideStep + 1) % GUIDE_STEPS.length;
    renderGuide();
  });
  const prev = document.getElementById('guide-prev');
  if (prev) prev.addEventListener('click', () => { guideStep--; renderGuide(); });
}
function closeGuide(done) {
  guideEl.classList.remove('show');
  if (!done) setTimeout(() => reopenEl.classList.add('show'), 200);
}

// Init
navigate('dashboard');
setTimeout(renderGuide, 600);
</script>
</body>
